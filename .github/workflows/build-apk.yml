# Build the RegisterBook Android APK on every push to main.
#
# Output: ONE file — RegisterBook.apk — attached to a GitHub Release, so the
# owner can download it with a single tap (no zip, no unzipping).
#
# What this does:
#   1. Copies the website files into www/ (tools/prepare-www.js). That script
#      also stamps www/rb-build.js with whether Firebase is in this build.
#   2. Syncs them into the Android project (npx cap sync)
#   3. Generates a stable signing key (or restores the owner's from secrets)
#   4. Builds a signed RELEASE APK
#   5. Publishes it as the asset of a GitHub Release named "RegisterBook APK"
#
# The website itself (GitHub Pages) is unaffected by this workflow.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (Capacitor 8 needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK (preinstalled on the runner)
        # GitHub's ubuntu runners already ship the Android SDK; the
        # setup-android action is unreliable, so install what we need
        # directly. Capacitor 8 needs compile/target SDK 36.
        # sdkmanager is not on PATH — use its full location.
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets (www/)
        run: node tools/prepare-www.js

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # The APK must be signed or Android refuses to install an update over
      # an already-installed copy. The key is cached between runs by its
      # SHA-256 (Android blocks updates signed with a different key), so
      # every build after the first can update the app in place.
      # If the owner later adds KEYSTORE_BASE64 + KEYSTORE_PASSWORD secrets,
      # those are used instead — that is the Play-Store-strength setup.
      - name: Provide the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using the owner's keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/registerbook.jks
            echo "KEYSTORE_FILE=registerbook.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=registerbook" >> "$GITHUB_ENV"
            echo "STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "USING_OWN_KEYSTORE=yes" >> "$GITHUB_ENV"
          else
            # The key itself is restored (or created) by the cache steps below.
            echo "KEYSTORE_FILE=registerbook.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=registerbook" >> "$GITHUB_ENV"
            echo "STORE_PASS=registerbook" >> "$GITHUB_ENV"
          fi

      # Cache the generated key under a FIXED key name.
      #
      # Android refuses to install an update signed with a different key, so
      # every build must reuse the same keystore. A hash of the file cannot be
      # used (it does not exist on the first run, so the key would change and
      # the cache would never hit). A fixed key means the first run seeds it
      # and every later run restores exactly the same signing key.
      # Skipped when the owner supplies a permanent keystore via secrets.
      - name: Restore the project signing key
        id: keycache
        if: env.USING_OWN_KEYSTORE != 'yes'
        uses: actions/cache@v4
        with:
          path: android/app/registerbook.jks
          key: rb-signing-key-v1

      - name: Make sure the signing key exists
        if: env.USING_OWN_KEYSTORE != 'yes'
        run: |
          if [ ! -f android/app/registerbook.jks ]; then
            echo "No cached key — creating the project's signing key."
            keytool -genkeypair -v \
              -keystore android/app/registerbook.jks \
              -alias registerbook \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass registerbook -keypass registerbook \
              -dname "CN=RegisterBook, OU=Community, O=RegisterBook, L=Hyderabad, S=Telangana, C=IN"
            echo "KEYSTORE_CREATED=yes" >> "$GITHUB_ENV"
          else
            echo "Restored the existing signing key from cache."
          fi

      # Patch the ONE existing android { } block instead of appending a second
      # one, and give every build a strictly higher versionCode so Android
      # always treats it as an update (a repeated versionCode can be refused
      # with "App not installed").
      - name: Configure signing and version
        run: |
          python3 - "${{ github.run_number }}" <<'PYEOF'
          import re, sys, os
          build_number = sys.argv[1]
          path = "android/app/build.gradle"
          src = open(path).read()

          # 1) a release signingConfig, right after the android { line
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE") ?: "registerbook.jks")
                      storePassword System.getenv("STORE_PASS") ?: ""
                      keyAlias System.getenv("KEYSTORE_ALIAS") ?: ""
                      keyPassword System.getenv("STORE_PASS") ?: ""
                  }
              }
              defaultConfig {"""
          src = src.replace("    defaultConfig {", signing, 1)

          # 2) hook it into the existing release buildType
          src = src.replace("        release {\n            minifyEnabled false",
                            "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false", 1)

          # 3) monotonic versionCode / readable versionName
          src = re.sub(r"versionCode \d+", "versionCode " + build_number, src, count=1)
          src = re.sub(r'versionName "[^"]*"', 'versionName "1.0.' + build_number + '"', src, count=1)

          open(path, "w").write(src)
          print(src[:1600])
          PYEOF

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_ALIAS: ${{ env.KEYSTORE_ALIAS }}
          STORE_PASS: ${{ env.STORE_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RegisterBook.apk
          ls -lh RegisterBook.apk
          echo "APK_SIZE=$(du -h RegisterBook.apk | cut -f1)" >> "$GITHUB_ENV"

      # Read the version straight out of the APK instead of trusting the
      # workflow number. This is the same pair Android compares, so the
      # in-app updater can never be told about a version that does not exist.
      - name: Read the built version from the APK
        id: apkver
        run: |
          set -e
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          BADGING=$("$AAPT2" dump badging android/app/build/outputs/apk/release/app-release.apk | head -n1)
          VCODE=$(echo "$BADGING" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
          VNAME=$(echo "$BADGING" | sed -E "s/.*versionName='([^']*)'.*/\1/")
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "APK says: $VNAME (code $VCODE)"

      # Build the independent OTA bundle from the same source revision. Its
      # version advances monotonically with CI so phones can silently adopt it.
      - name: Build OTA content bundle
        id: bundle
        run: |
          node tools/make-bundle.js --out . --version "${{ github.run_number }}"
          node -e 'const r=require("./tools/make-bundle.js").build({outDir:".",version:Number(process.env.BUNDLE_VERSION)}); console.log("bundle_sha256="+r.sha256)' >> "$GITHUB_OUTPUT"
        env:
          BUNDLE_VERSION: ${{ github.run_number }}

      # version.json is what the installed app downloads to learn that a newer
      # build or content bundle exists. APK and bundle versions remain separate.
      - name: Write version.json (what the in-app updater reads)
        run: |
          node -e '
            const fs = require("fs");
            const version_name = process.env.VERSION_NAME;
            const version_code = Number(process.env.VERSION_CODE);
            const manifest = {
              version_name,
              version_code,
              title: "Update to the latest version",
              changelog: "Bug fixes, faster performance, and new features.",
              apk_url: "https://github.com/Mahicouragw/Register-book/releases/download/apk-latest/RegisterBook.apk",
              bundle_url: "https://github.com/Mahicouragw/Register-book/releases/download/apk-latest/bundle.zip",
              bundle_version: Number(process.env.BUNDLE_VERSION),
              bundle_sha256: process.env.BUNDLE_SHA256,
              force_update: false
            };
            fs.writeFileSync("version.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(fs.readFileSync("version.json", "utf8"));
          '
        env:
          VERSION_NAME: ${{ steps.apkver.outputs.version_name }}
          VERSION_CODE: ${{ steps.apkver.outputs.version_code }}
          BUNDLE_VERSION: ${{ github.run_number }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.bundle_sha256 }}

      # Commit version.json back to main only when it actually changed, so the
      # published manifest always points at the newest APK. The [skip ci] tag
      # stops this commit from triggering another build (which would loop).
      # Pages then republishes the site, and every installed app sees the new
      # version on its next launch.
      - name: Publish version.json so installed apps can see the update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- version.json; then
            echo "version.json is already current."
            exit 0
          fi
          git add version.json
          git commit -m "chore: publish version.json for ${{ steps.apkver.outputs.version_name }} (code ${{ steps.apkver.outputs.version_code }}) [skip ci]"
          # Do not fail the whole build over this. The APK is already published
          # at this point, so a rejected commit only means the in-app update
          # panel is not offered yet — never that the release is broken.
          if git push; then
            echo "version.json pushed — installed apps will see the update."
          else
            echo "::warning title=version.json not published::The APK was released, but the manifest commit was rejected. Update version.json on main by hand so the in-app updater can offer this build."
          fi

      - name: Upload to the workflow run (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: RegisterBook-apk
          path: RegisterBook.apk
          if-no-files-found: error

      # This is what the owner taps: a normal .apk download link.
      - name: Publish APK and OTA bundle as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          files: |
            RegisterBook.apk
            bundle.zip
          name: RegisterBook APK (latest)
          body: |
            **RegisterBook — install this file on your phone.**

            1. Tap `RegisterBook.apk` below.
            2. Open the downloaded file.
            3. If Android asks, allow "Install unknown apps" for your browser.
            4. Tap **Install** (or **Update** if you already have the app).

            Sign in with Google: the app opens Chrome, and Chrome brings you
            straight back to the app signed in.

            Built automatically from `main` on every push.
          files: RegisterBook.apk
          make_latest: true
          overwrite_files: true
